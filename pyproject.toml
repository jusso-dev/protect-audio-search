[project]
name = "protect-audio-search"
version = "0.1.0"
description = "On-demand CLI to search UniFi Protect footage audio for revving, burnouts and tyre squeal"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Justin Middler" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
protect-audio-search = "protect_audio_search.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["protect_audio_search"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
